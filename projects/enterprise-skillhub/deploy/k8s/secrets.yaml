########################################################
# Enterprise SkillHub — Secrets Template
# WARNING: This is a TEMPLATE. Do NOT commit real values.
# Use Sealed Secrets (kubeseal) for actual deployment.
########################################################
apiVersion: v1
kind: Secret
metadata:
  name: skillhub-secrets
  namespace: skillhub
  labels:
    app.kubernetes.io/name: enterprise-skillhub
type: Opaque
stringData:
  # PostgreSQL
  DATABASE_URL: "postgresql://skillhub:<PG_PASSWORD>@skillhub-postgres:5432/skillhub?schema=public"
  PG_PASSWORD: "<CHANGE_ME>"

  # JWT
  JWT_SECRET: "<CHANGE_ME_RANDOM_64_CHARS>"

  # LDAP / Active Directory
  LDAP_BIND_PASSWORD: "<CHANGE_ME>"

  # MinIO
  MINIO_ACCESS_KEY: "<CHANGE_ME>"
  MINIO_SECRET_KEY: "<CHANGE_ME>"

  # Redis (if password protected)
  REDIS_PASSWORD: "<CHANGE_ME>"

---
# Sealed Secrets usage:
# 1. Install kubeseal: brew install kubeseal
# 2. Seal the secret:
#    kubeseal --format=yaml \
#      --cert=sealed-secrets-cert.pem \
#      < secrets.yaml \
#      > sealed-secrets.yaml
# 3. Apply: kubectl apply -f sealed-secrets.yaml
# 4. NEVER apply raw secrets.yaml to production
