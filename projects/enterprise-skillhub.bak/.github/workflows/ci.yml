name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: skillhub
          POSTGRES_PASSWORD: skillhub
          POSTGRES_DB: skillhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://skillhub:skillhub@localhost:5432/skillhub?schema=public

      - name: Run unit tests
        run: npx jest --passWithNoTests --forceExit

      - name: Run e2e tests
        run: npx jest --config jest-e2e.config.ts --passWithNoTests --forceExit
        env:
          DATABASE_URL: postgresql://skillhub:skillhub@localhost:5432/skillhub?schema=public
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          REDIS_URL: redis://localhost:6379
          LDAP_URL: ldap://localhost:389
          LDAP_BIND_DN: cn=admin,dc=test,dc=com
          LDAP_BIND_PASSWORD: admin
          LDAP_SEARCH_BASE: dc=test,dc=com
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: skillhub-packages
          BGE_M3_URL: http://localhost:8080

      - name: Build application
        run: npm run build
