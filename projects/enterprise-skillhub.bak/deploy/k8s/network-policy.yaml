########################################################
# Enterprise SkillHub — Kubernetes NetworkPolicy
# Default: deny all ingress, then explicitly allow
########################################################

---
# Default deny all ingress in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: skillhub
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Backend: allow ingress from Ingress controller only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: skillhub
spec:
  podSelector:
    matchLabels:
      app: skillhub-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

---
# PostgreSQL: allow ingress from Backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-postgres
  namespace: skillhub
spec:
  podSelector:
    matchLabels:
      app: skillhub-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: skillhub-backend
      ports:
        - protocol: TCP
          port: 5432

---
# MinIO: allow ingress from Backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-minio
  namespace: skillhub
spec:
  podSelector:
    matchLabels:
      app: skillhub-minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: skillhub-backend
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001

---
# Redis: allow ingress from Backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-redis
  namespace: skillhub
spec:
  podSelector:
    matchLabels:
      app: skillhub-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: skillhub-backend
      ports:
        - protocol: TCP
          port: 6379

---
# BGE-M3: allow ingress from Backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-bge-m3
  namespace: skillhub
spec:
  podSelector:
    matchLabels:
      app: skillhub-bge-m3
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: skillhub-backend
      ports:
        - protocol: TCP
          port: 8080

---
# Allow Prometheus to scrape all pods (metrics)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: skillhub
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9090
