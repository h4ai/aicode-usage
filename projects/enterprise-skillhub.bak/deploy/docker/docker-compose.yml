########################################################
# Enterprise SkillHub — Docker Compose (Full Stack)
# Includes: backend, postgres, redis, minio
########################################################

services:
  # ========================
  # Backend API
  # ========================
  backend:
    image: enterprise-skillhub:latest
    container_name: skillhub-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"

      # Database
      DATABASE_URL: "postgresql://skillhub:skillhub_dev@postgres:5432/enterprise_skillhub?schema=public"

      # JWT
      JWT_SECRET: "dev-jwt-secret-change-in-production-at-least-64-chars-long-for-hs256"
      JWT_EXPIRES_IN: "12h"

      # LDAP (dev mode - optional)
      LDAP_URL: "ldap://openldap:389"
      LDAP_BIND_DN: "cn=admin,dc=skillhub,dc=dev"
      LDAP_BIND_PASSWORD: "admin_password"
      LDAP_SEARCH_BASE: "ou=users,dc=skillhub,dc=dev"
      LDAP_SEARCH_FILTER: "(uid={{username}})"
      LDAP_USE_TLS: "false"

      # MinIO (Object Storage)
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "skillhub-packages"

      # Redis
      REDIS_URL: "redis://redis:6379"

      # API
      API_PREFIX: "api/v1"
      APP_VERSION: "1.0.0"

      # BGE-M3 Embedding Service (optional)
      BGE_M3_URL: "http://bge-m3:8080"

      # CORS
      CORS_ORIGINS: "*"

      # Upstream Sync
      UPSTREAM_ALLOWED_URLS: "https://clawhub.com"
      UPSTREAM_SYNC_CRON: "0 2 * * *"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - skillhub

  # ========================
  # PostgreSQL
  # ========================
  postgres:
    image: postgres:16-alpine
    container_name: skillhub-postgres-compose
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: skillhub
      POSTGRES_PASSWORD: skillhub_dev
      POSTGRES_DB: enterprise_skillhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhub -d enterprise_skillhub"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - skillhub

  # ========================
  # Redis
  # ========================
  redis:
    image: redis:7-alpine
    container_name: skillhub-redis-compose
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks:
      - skillhub

  # ========================
  # MinIO (Object Storage)
  # ========================
  minio:
    image: minio/minio:latest
    container_name: skillhub-minio-compose
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - skillhub

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  skillhub:
    driver: bridge
